<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combate e atributos · v1</title>
<!-- PROTÓTIPO do combate e dos atributos (25/10/2026; nada no jogo). Os materiais, as fontes, os retratos e os ícones são
     os do jogo, lidos de rpg/web/static pelo servidor da demo (servidor.py); as regras rodam em motor/regras.py. -->
<link rel="stylesheet" href="/static/css/01-base.css">
<link rel="stylesheet" href="/static/css/11-tipografia.css">
<link rel="stylesheet" href="/tela/demo.css">
</head>
<body>
<header id="topo" class="m-painel">
  <h1>Combate<span> e atributos</span> <small>v1 · a primeira</small></h1>
  <a class="botao" href="/" title="A segunda versão (atual)">Ir para a v2</a>
  <label>Encontro <select id="encontro"></select></label>
  <label title="A construção do protagonista (os 24 pontos de atributo)">Construção <select id="distribuicao"></select></label>
  <button id="reiniciar" class="botao" title="R">Reiniciar <kbd>R</kbd></button>
  <span class="espaco"></span>
  <button class="botao" data-abrir="comparar" title="Os valores derivados de A, B, C e da livre lado a lado">Comparar</button>
  <button class="botao" data-abrir="situacao">Fora da luta</button>
  <button class="botao" data-abrir="resultados">Resultados</button>
</header>
<div id="teste" hidden></div>
<section id="faixa">
  <p id="objetivo"></p>
  <div id="ordem" aria-label="Ordem dos turnos"></div>
</section>
<main id="campo">
  <section id="grupo" aria-label="O grupo"></section>
  <section id="frente" aria-label="Os inimigos"></section>
  <aside id="lado" class="m-painel">
    <nav id="abas"><button data-aba="registro" class="atual">Registro</button><button data-aba="ficha">Ficha</button></nav>
    <div id="registro" aria-live="polite"></div>
    <div id="ficha" hidden></div>
  </aside>
  <div id="fim" hidden></div>
</main>
<footer id="doca" class="m-painel"></footer>
<div id="modal" hidden><div class="caixa m-janela" role="dialog" aria-modal="true"><button class="fechar" aria-label="Fechar">×</button><div id="modal-corpo"></div></div></div>

<script src="/static/sprites-dados.js"></script>
<script src="/static/sprites.js"></script>
<script>Sprites.publicar();</script>
<script src="/static/retratos.js"></script>
<script src="/static/desenhos.js"></script>
<script src="/static/icones.js"></script>
<script src="/tela/demo.js"></script>
</body>
</html>
