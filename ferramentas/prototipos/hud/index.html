<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo: ficha do herói (experimento)</title>
<link rel="icon" href="data:,">
<!-- Experimento fora do jogo. O CSS e os scripts de produção só dão o entorno (o topo, a cena, o mundo) e a paleta;
     a ficha é toda daqui (ficha.css, ficha.js, arte.js). Nada nesta pasta é carregado pelo jogo. -->
<link rel="stylesheet" href="../../../rpg/web/static/css/01-base.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/02-hud.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/03-batalha.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/04-pagina.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/05-paineis.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/06-talentos-avisos.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/07-titulo-responsivo.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/08-mercado.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/09-comitiva.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/10-contratos.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/11-tipografia.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/12-acoes-combate.css">
<link rel="stylesheet" href="../../../rpg/web/static/css/13-realce.css">
<link rel="stylesheet" href="ficha.css">
<link rel="stylesheet" href="ficha-assets.css">
<link rel="stylesheet" href="hud3.css">
<link rel="stylesheet" href="hud4.css">
<link rel="stylesheet" href="hud4c.css">
<link rel="stylesheet" href="hud4p.css">
<link rel="stylesheet" href="hud4p-luta.css">
<link rel="stylesheet" href="jogo/superficies.css">
<script src="../../../rpg/web/static/sprites-dados.js"></script>
<script src="../../../rpg/web/static/sprites.js"></script>
<script>Sprites.publicar();</script>
</head>
<body>

<div id="atmosfera" aria-hidden="true"><div class="camada vinheta"></div></div>
<header id="topo"></header>

<main id="mesa">
  <aside id="ficha" aria-label="Herói"></aside>
  <section id="palco"></section>
  <aside id="mundo" class="painel m-painel" aria-label="Mundo"></aside>
</main>

<!-- Controles de demonstração: fora da interface do jogador (D mostra e esconde). -->
<section id="demo" aria-label="Controles de demonstração">
  <h2>Demonstração <span>D esconde</span></h2>
  <fieldset data-chave="versao"><legend>Versão</legend><div class="op">
    <button type="button" data-v="anterior">Anterior</button><button type="button" data-v="assets">Assets</button><button type="button" data-v="hud3">HUD 3</button><button type="button" data-v="hud4">HUD 4</button><button type="button" data-v="hud4c">HUD 4 completa</button><button type="button" data-v="hud4p">HUD 4 pixel</button></div></fieldset>
  <fieldset data-chave="entorno"><legend>Entorno</legend><div class="op">
    <button type="button" data-v="bosque">Bosque (missão)</button><button type="button" data-v="brejo">Brejo</button>
    <button type="button" data-v="combate">Combate</button><button type="button" data-v="capela">Capela</button></div></fieldset>
  <fieldset data-chave="pagina"><legend>Página</legend><div class="op">
    <button type="button" data-v="lugar">o lugar</button><button type="button" data-v="missao">cena de missão</button></div></fieldset>
  <fieldset data-chave="rastreios"><legend>Missões</legend><div class="op">
    <button type="button" data-v="uma">só a missão</button><button type="button" data-v="varias">missão e contratos</button></div></fieldset>
  <fieldset data-chave="modal"><legend>Janela</legend><div class="op">
    <button type="button" data-v="nao">fechada</button><button type="button" data-v="sim">comparar anel</button></div></fieldset>
  <fieldset data-chave="estados"><legend>Estados</legend><div class="op">
    <button type="button" data-v="nao">escondidos</button><button type="button" data-v="sim">à vista</button></div></fieldset>
  <fieldset data-chave="nome"><legend>Nome</legend><div class="op">
    <button type="button" data-v="Jean">Jean</button><button type="button" data-v="PARAIBATRON">PARAIBATRON</button>
    <button type="button" data-v="Aldebarã de Montemor">Aldebarã de Montemor</button></div></fieldset>
  <fieldset data-chave="nivel"><legend>Nível</legend><div class="op">
    <button type="button" data-v="1">1</button><button type="button" data-v="6">6</button><button type="button" data-v="14">14</button></div></fieldset>
  <fieldset data-chave="equip"><legend>Equipamento</legend><div class="op">
    <button type="button" data-v="completo">completo</button><button type="button" data-v="parcial">parcial</button><button type="button" data-v="vazio">vazio</button></div></fieldset>
  <fieldset data-chave="bolsa"><legend>Bolsa</legend><div class="op">
    <button type="button" data-v="comum">comum</button><button type="button" data-v="cheia">cheia</button><button type="button" data-v="vazia">vazia</button></div></fieldset>
  <fieldset data-chave="feridas"><legend>Ferimentos</legend><div class="op">
    <button type="button" data-v="0">sem</button><button type="button" data-v="1">com</button></div></fieldset>
  <fieldset data-chave="fome"><legend>Fome</legend><div class="op">
    <button type="button" data-v="0">sem</button><button type="button" data-v="1">com</button></div></fieldset>
  <fieldset data-chave="superficie"><legend>Superfície (teste)</legend><div class="op">
    <button type="button" data-v="atual">atual</button><button type="button" data-v="escura">mais escura</button><button type="button" data-v="escura-transicao">escura + transição</button></div></fieldset>
  <fieldset data-chave="icones"><legend>Ícones</legend><div class="op">
    <button type="button" data-v="novos">novos</button><button type="button" data-v="atuais">atuais</button></div></fieldset>
  <p>Os números, nomes, dicas e espaços vêm do motor (dados.js). O nome é livre, como no jogo. <b>V</b> passa de uma versão à outra; <b>Esc</b> fecha a janela.</p>
</section>
<button type="button" id="mostrar-demo" hidden>Demonstração (D)</button>

<script src="../../../rpg/web/static/vista.js"></script>
<script src="dados.js"></script>
<script src="composicao.js"></script>
<script src="composicao3.js"></script>
<script src="composicao4c.js"></script>
<script src="icones.js"></script>
<script src="topo.js"></script>
<script src="arte.js"></script>
<script src="ficha.js"></script>
<script>
"use strict";
// O entorno: o topo, a cena e o mundo fotografados do jogo, e a paisagem desenhada de verdade. "Bosque" é a campanha
// com a missão e os contratos (composicao3.js); "Brejo", a fotografia das duas primeiras tentativas (composicao.js);
// "Combate" e "Capela", o Guerreiro de nível 6 numa luta e na capela (composicao4c.js).
const ENTORNOS = { bosque: { ...COMPOSICAO3.local, evento: COMPOSICAO3.evento }, brejo: COMPOSICAO,
  combate: COMPOSICAO4C.combate, capela: COMPOSICAO4C.capela };
let entornoAtual = null;
// A paisagem: vista.js guarda o primeiro canvas #vista que vê e desenha sempre nele. A fotografia de cada entorno traz
// um canvas novo (vazio): ele dá lugar ao de sempre, com as classes e o estilo da fotografia. Na capela, a sala é a
// imagem fotografada do canvas (cenas.js pinta a sala nele; a sala não é redesenhada aqui).
let vistaCanvas = null;
function montarEntorno(nome) {
  const C = ENTORNOS[nome] || ENTORNOS.bosque;
  document.body.dataset.bioma = C.corpo.bioma;
  document.body.dataset.periodo = C.corpo.periodo;
  document.getElementById("topo").innerHTML = C.topo;
  document.getElementById("palco").innerHTML = C.palco;
  const novo = document.getElementById("vista");
  if (!vistaCanvas) vistaCanvas = novo;
  if (novo && novo !== vistaCanvas) {
    vistaCanvas.className = novo.className;
    vistaCanvas.setAttribute("style", novo.getAttribute("style") || "");
    novo.replaceWith(vistaCanvas);
  }
  document.getElementById("mundo").innerHTML = C.mundo;
  // Os controles do entorno recebem foco pelo teclado (para conferir o anel de foco); os outros, não. Nada responde
  // ao clique: o protótipo não fala com o motor.
  document.querySelectorAll("#palco button, #palco [tabindex], #mundo button, #mundo [tabindex], #topo button").forEach((b) => b.setAttribute("tabindex", "-1"));
  document.querySelectorAll("#prompt .escolha, #doca .atalho, #mundo .caminho, #mundo .rastro-contrato").forEach((b) => b.setAttribute("tabindex", "0"));
  document.querySelectorAll("#palco .escolha").forEach((b) => { b.style.opacity = "1"; b.style.animation = "none"; });
  Vista.atualizar({ local: C.vista.local, mundo: C.vista.mundo });  // (antes da troca abaixo: a vista guarda o canvas)
  if (C.vistaImagem && vistaCanvas) {
    const foto = document.createElement("img");
    foto.id = "vista"; foto.className = vistaCanvas.className; foto.alt = "";
    foto.src = C.vistaImagem.src; foto.width = C.vistaImagem.largura; foto.height = C.vistaImagem.altura;
    foto.style.imageRendering = "pixelated";
    vistaCanvas.replaceWith(foto);
  }
  entornoAtual = nome;
}
const folhaDoLugar = {};
function ajustarEntorno() {
  const C = ENTORNOS[escolha.entorno] || ENTORNOS.bosque;
  if (entornoAtual !== escolha.entorno) { montarEntorno(escolha.entorno); folhaDoLugar.html = document.getElementById("folha").innerHTML; }
  // A página: o lugar (o menu) ou a cena de missão logo depois dele (texto longo, para a rolagem).
  const folha = document.getElementById("folha");
  folha.innerHTML = escolha.pagina === "missao" && C.evento ? C.evento.folha : folhaDoLugar.html;
  folha.querySelectorAll(".escolha, button.continuar").forEach((b) => { b.style.opacity = "1"; b.style.animation = "none"; b.setAttribute("tabindex", "0"); });
  // Missões: só a missão, ou a missão e os dois contratos (o painel do mundo como o jogo desenha cada caso).
  document.querySelectorAll("#mundo .secao.rastreador").forEach((sec, i) => { sec.hidden = escolha.rastreios === "uma" && i > 0; });
  // A faixa de estados dos controles (demonstração, fora do jogo): no alto da página.
  document.getElementById("estados-demo")?.remove();
  if (escolha.estados === "sim") folha.insertAdjacentHTML("afterbegin", ESTADOS_DEMO);
  // A janela: a comparação do anel achado, por cima de tudo (a fotografia do cenário "aneis").
  document.getElementById("sobre-achado")?.remove();
  if (escolha.modal === "sim") {
    document.body.insertAdjacentHTML("beforeend", COMPOSICAO3.modal);
    document.querySelectorAll("#sobre-achado button").forEach((b) => b.setAttribute("tabindex", "0"));
  }
}
const ESTADOS_DEMO = `<section id="estados-demo" aria-label="Estados dos controles (demonstração)">
  <h4>Estados dos controles · demonstração</h4>
  <div class="linha">
    <button type="button" class="escolha"><span class="tecla">1</span><span class="rotulo">Normal</span></button>
    <button type="button" class="escolha demo-hover"><span class="tecla">2</span><span class="rotulo">Mouse por cima</span></button>
    <button type="button" class="escolha demo-pressionado"><span class="tecla">3</span><span class="rotulo">Pressionado</span></button>
    <button type="button" class="escolha" aria-pressed="true"><span class="tecla">4</span><span class="rotulo">Selecionado</span></button>
    <button type="button" class="escolha" aria-disabled="true"><span class="tecla">5</span><span class="rotulo">Indisponível</span></button>
    <button type="button" class="escolha demo-foco"><span class="tecla">6</span><span class="rotulo">Foco do teclado</span></button>
  </div>
  <div class="linha">
    <span class="aba-demo">Normal</span><span class="aba-demo demo-hover">Mouse</span><span class="aba-demo" aria-selected="true">Aberta</span>
  </div>
</section>`;

// Os assets da ficha vão para o CSS como variáveis (como o jogo faz com os materiais dele).
document.documentElement.style.setProperty("--f-moldura", `url(${Arte.moldura()})`);
document.documentElement.style.setProperty("--f-espaco", `url(${Arte.espaco()})`);

const escolha = { versao: "hud4", entorno: "bosque", pagina: "lugar", rastreios: "varias", modal: "nao", estados: "nao", nome: "Jean", nivel: "6", equip: "completo", bolsa: "comum", feridas: "0", fome: "0", icones: "novos", superficie: "atual" };
try { Object.assign(escolha, JSON.parse(localStorage.getItem("prototipo-ficha") || "{}")); } catch (e) { /* sem armazenamento */ }
const ficha = document.getElementById("ficha");
function redesenhar() {
  const h = FICHAS[[escolha.nivel, escolha.equip, escolha.feridas, escolha.fome, escolha.bolsa].join("|")];
  Ficha.iconesNovos = escolha.icones === "novos";
  Ficha.versao = escolha.versao;
  document.body.className = (ENTORNOS[escolha.entorno] || ENTORNOS.bosque).corpo.classe;
  document.body.classList.toggle("v3", ["hud3", "hud4", "hud4c", "hud4p"].includes(escolha.versao));  // a HUD 4 parte da 3
  document.body.classList.toggle("v4", ["hud4", "hud4c", "hud4p"].includes(escolha.versao));  // a completa, da 4
  document.body.classList.toggle("v4c", ["hud4c", "hud4p"].includes(escolha.versao));  // e a pixel, da completa
  document.body.classList.toggle("v4p", escolha.versao === "hud4p");
  // a comparação de superfícies (jogo/superficies.css): só na HUD 4 pixel, só os fundos
  if (escolha.versao === "hud4p" && escolha.superficie !== "atual") document.body.dataset.superficie = escolha.superficie;
  else delete document.body.dataset.superficie;
  ajustarEntorno();
  const familia = escolha.icones === "novos" ? { hud4c: Icones4c, hud4p: Icones4p }[escolha.versao] || null : null;
  Topo.familia = familia;
  Topo.desenhar(document.getElementById("hud-linha"), h);  // o topo e a ficha: o mesmo estado
  Icones.desligar();  // a doca, os caminhos, a janela e a luta, fotografados do jogo
  if (familia) familia.aplicar();
  Ficha.fecharDica();
  Ficha.desenhar(ficha, h, escolha.nome);
  document.querySelectorAll("#demo fieldset").forEach((f) => f.querySelectorAll("button").forEach((b) =>
    b.setAttribute("aria-pressed", String(escolha[f.dataset.chave] === b.dataset.v))));
  try { localStorage.setItem("prototipo-ficha", JSON.stringify(escolha)); } catch (e) { /* sem armazenamento */ }
}
document.querySelectorAll("#demo fieldset").forEach((f) => f.addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-v]");
  if (b) { escolha[f.dataset.chave] = b.dataset.v; redesenhar(); }
}));
const demo = document.getElementById("demo"), mostrar = document.getElementById("mostrar-demo");
function alternarDemo() { demo.hidden = !demo.hidden; mostrar.hidden = !demo.hidden; }
mostrar.addEventListener("click", alternarDemo);
document.addEventListener("keydown", (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === "d" || ev.key === "D") alternarDemo();
  if (ev.key === "v" || ev.key === "V") { const vs = ["anterior", "assets", "hud3", "hud4", "hud4c", "hud4p"]; escolha.versao = vs[(vs.indexOf(escolha.versao) + 1) % vs.length]; redesenhar(); }  // a mesma janela, a próxima versão
  if (ev.key === "Escape" && escolha.modal === "sim") { escolha.modal = "nao"; redesenhar(); }
});
Ficha.ligarDicas(ficha);
Ficha.ligarDicas(document.getElementById("palco"));
addEventListener("resize", () => Ficha.desenhar(ficha, FICHAS[[escolha.nivel, escolha.equip, escolha.feridas, escolha.fome, escolha.bolsa].join("|")], escolha.nome));
document.fonts.ready.then(redesenhar);
redesenhar();
</script>
</body>
</html>
