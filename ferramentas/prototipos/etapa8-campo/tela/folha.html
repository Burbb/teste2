<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Campo Livre · folha dos combatentes</title>
<!-- A folha dos sprites do protótipo de campo livre: cada pose ampliada 8× e o grupo no tamanho do jogo (2× e 3×). -->
<style>
  body { margin: 0; padding: 16px; background: #1d1b18; color: #ddd; font: 13px/1.3 sans-serif; }
  canvas { image-rendering: pixelated; display: block; margin: 6px 0 18px; }
</style>
</head>
<body>
<div id="raiz"></div>
<script type="module">
import { prepararSprites, MODELOS } from "./sprites.js";
const Q = prepararSprites();
const poses = ["parado", "andarA", "andarB", "preparo", "golpe", "recuo", "caido", "giro1"];
const raiz = document.getElementById("raiz");
const Z = 8;
for (const tipo of Object.keys(MODELOS)) {
  const t = document.createElement("div"); t.textContent = tipo; raiz.append(t);
  const c = document.createElement("canvas");
  const larg = 22 * Z, alt = 22 * Z;
  c.width = larg * poses.length; c.height = alt * 2;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  for (let eq = 0; eq < 2; eq++) poses.forEach((p, i) => {
    const s = Q[tipo][eq][p];
    g.fillStyle = (i + eq) % 2 ? "#5c7a4a" : "#56744a"; g.fillRect(i * larg, eq * alt, larg, alt);
    g.drawImage(s.d, i * larg + Z * 2, eq * alt + Z * 2, s.w * Z, s.h * Z);
  });
  raiz.append(c);
}
// o grupo no tamanho do jogo
for (const z of [2, 3]) {
  const t = document.createElement("div"); t.textContent = `tamanho do jogo (${z}×)`; raiz.append(t);
  const c = document.createElement("canvas"); c.width = 220 * z; c.height = 70 * z;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false; g.scale(z, z);
  g.fillStyle = "#5a7748"; g.fillRect(0, 0, 220, 70);
  const lista = [["guerreiro", 0, 20, 40], ["mago", 0, 40, 40], ["soldado", 0, 60, 30], ["soldado", 0, 70, 38], ["arqueiro", 0, 64, 50],
    ["veterano", 1, 120, 34], ["soldado", 1, 130, 28], ["soldado", 1, 132, 44], ["arqueiro", 1, 150, 36], ["estandarte", 1, 165, 40], ["campeao", 1, 190, 44]];
  for (const [tipo, eq, x, y] of lista) {
    const s = Q[tipo][eq].parado;
    g.fillStyle = "rgba(0,0,0,0.28)"; g.fillRect(x - 3, y - 1, 7, 2);
    g.drawImage(eq ? s.e : s.d, Math.round(x - s.ax), Math.round(y - s.ay));
  }
  raiz.append(c);
}
</script>
</body>
</html>
