<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crônicas da Fenda</title>
<link rel="stylesheet" href="/static/estilo.css">
</head>
<body class="sem-heroi" data-bioma="vila" data-periodo="0">

<div id="atmosfera" aria-hidden="true">
  <div class="camada corrupcao"></div>
  <div class="camada vinheta"></div>
  <div class="camada dor"></div>
  <div id="brasas"></div>
</div>

<header id="topo">
  <div class="marca">Crônicas da Fenda</div>
  <div id="tempo" class="topo-info"></div>
  <div id="modificadores" class="topo-info" aria-label="Efeitos do clima e da hora"></div>
  <div id="corrupcao-topo" class="topo-info" title="Corrupção do reino. Em 100%, tudo acaba.">
    <span class="rotulo">Corrupção</span>
    <span class="barra-px corrupcao"><span class="enchimento"></span></span>
    <span class="valor">0%</span>
  </div>
  <div id="sigilos-topo" class="topo-info" title="Sigilos dos guardiões"></div>
  <nav id="acoes-topo">
    <button data-acao="heroi" class="so-estreito" title="Herói (I)">Herói</button>
    <button data-acao="mapa" title="Mapa grande (M)">Mapa <kbd>M</kbd></button>
    <button data-acao="historico" title="Histórico da partida (H)">Histórico <kbd>H</kbd></button>
    <button data-acao="velocidade" title="Velocidade do texto (V)">Texto: <span id="vel-rotulo">normal</span></button>
    <button data-acao="fonte" title="Alterna entre as fontes de livro (mais legíveis) e as fontes pixel">Fonte: <span id="fonte-rotulo">livro</span></button>
    <button data-acao="som" title="Som (S)" id="botao-som">Som</button>
  </nav>
</header>

<main id="mesa">
  <aside id="heroi" class="painel moldura" aria-label="Herói"></aside>

  <section id="palco">
    <div id="hud" class="moldura" aria-live="polite">
      <div id="hud-linha"></div>
      <div id="batalha"></div>
    </div>
    <article id="pagina" class="moldura">
      <canvas id="vista" width="320" height="72" aria-hidden="true"></canvas>
      <div id="folha">
        <header id="cena-cab"></header>
        <div id="texto" aria-live="polite"></div>
        <div id="prompt"></div>
      </div>
    </article>
  </section>

  <aside id="mundo" class="painel moldura" aria-label="Mundo"></aside>
</main>

<div id="gaveta-historico" class="gaveta moldura" hidden>
  <div class="gaveta-cab"><h2>Histórico da jornada</h2><button data-acao="historico">Fechar <kbd>Esc</kbd></button></div>
  <div id="historico-lista"></div>
</div>

<div id="sobre-mapa" class="sobreposicao" hidden>
  <div class="sobre-caixa moldura">
    <div class="gaveta-cab"><h2>Mapa do reino</h2><button data-acao="mapa">Fechar <kbd>Esc</kbd></button></div>
    <div id="mapa-grande"></div>
    <div id="mapa-legenda"></div>
  </div>
</div>

<div id="sobre-talentos" class="sobreposicao" hidden>
  <div class="sobre-caixa moldura talentos-caixa">
    <div class="gaveta-cab"><h2 id="talentos-titulo">Talentos</h2><button data-acao="fechar-talentos">Fechar <kbd>Esc</kbd></button></div>
    <div id="arvore"></div>
    <div id="talento-info" class="moldura" hidden></div>
  </div>
</div>

<div id="celebracao" class="sobreposicao" hidden></div>
<div id="toasts"></div>

<div id="aviso-fim" class="sobreposicao" hidden>
  <div class="sobre-caixa moldura fim"><h2>Até a próxima jornada</h2><p>Você já pode fechar esta janela.</p></div>
</div>

<script src="/static/sprites.js"></script>
<script src="/static/som.js"></script>
<script src="/static/vista.js"></script>
<script src="/static/mapa.js"></script>
<script src="/static/telas.js"></script>
<script src="/static/batalha.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
