<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crônicas da Fenda</title>
<!-- estilos por componente, nesta ordem (a ordem decide quem vence) -->
<link rel="stylesheet" href="/static/css/01-base.css">
<link rel="stylesheet" href="/static/css/02-hud.css">
<link rel="stylesheet" href="/static/css/03-batalha.css">
<link rel="stylesheet" href="/static/css/04-pagina.css">
<link rel="stylesheet" href="/static/css/05-paineis.css">
<link rel="stylesheet" href="/static/css/06-talentos-avisos.css">
<link rel="stylesheet" href="/static/css/07-titulo-responsivo.css">
<link rel="stylesheet" href="/static/css/08-mercado.css">
<link rel="stylesheet" href="/static/css/09-comitiva.css">
<link rel="stylesheet" href="/static/css/10-contratos.css">
<link rel="stylesheet" href="/static/css/11-tipografia.css">
<link rel="stylesheet" href="/static/css/12-acoes-combate.css">
<link rel="stylesheet" href="/static/css/13-realce.css">
<!-- a paleta indexada e os materiais em pixel (sprites.js) vão para o :root antes da primeira pintura -->
<script src="/static/sprites-dados.js"></script>
<script src="/static/sprites.js"></script>
<script>Sprites.publicar();</script>
</head>
<body class="sem-heroi" data-bioma="vila" data-periodo="0">

<div id="atmosfera" aria-hidden="true">
  <div class="camada vinheta"></div>
  <div class="camada dor"></div>
  <div class="camada fio"></div>
  <div id="brasas"></div>
</div>

<header id="topo">
  <div class="marca">Crônicas da Fenda</div>
  <div id="tempo" class="topo-info"></div>
  <div id="modificadores" class="topo-info" aria-label="Efeitos do clima e da hora"></div>
  <div id="sigilos-topo" class="topo-info" title="Sigilos dos guardiões"></div>
  <nav id="acoes-topo">
    <button data-acao="heroi" class="so-estreito" title="Herói (I)">Herói</button>
    <button data-acao="mundo" class="so-medio" title="O lugar e os caminhos (N)">Mundo <kbd>N</kbd></button>
    <button data-acao="mapa" title="Mapa grande (M)">Mapa <kbd>M</kbd></button>
    <button data-acao="historico" title="Histórico da partida (H)">Histórico <kbd>H</kbd></button>
    <button data-acao="velocidade" title="Velocidade do texto (V)">Texto: <span id="vel-rotulo">normal</span></button>
    <button data-acao="fonte" title="Alterna entre as fontes de livro (mais legíveis) e as fontes pixel">Fonte: <span id="fonte-rotulo">livro</span></button>
    <button data-acao="som" title="Som (S)" id="botao-som">Som</button>
  </nav>
</header>

<main id="mesa">
  <aside id="heroi" class="painel m-painel" aria-label="Herói"></aside>

  <section id="palco">
    <div id="hud" class="m-painel" aria-live="polite">
      <div id="hud-linha"></div>
      <div id="batalha"></div>
    </div>
    <!-- A cena: a arte do lugar presa no topo, a barra das telas de menu (título e Voltar) e a página que rola. -->
    <article id="cena" class="m-painel m-perg">
      <canvas id="vista" width="320" height="72" aria-hidden="true"></canvas>
      <div id="barra-tela"></div>
      <div id="pagina">
        <div id="folha">
          <header id="cena-cab"></header>
          <div id="texto" aria-live="polite"></div>
          <div id="prompt"></div>
        </div>
      </div>
    </article>
    <nav id="doca" class="m-painel" aria-label="Atalhos"></nav>
  </section>

  <aside id="mundo" class="painel m-painel" aria-label="Mundo"></aside>
</main>

<div id="gaveta-historico" class="gaveta m-janela" hidden>
  <div class="gaveta-cab"><h2>Histórico da jornada</h2><button data-acao="historico">Fechar <kbd>Esc</kbd></button></div>
  <div id="historico-lista"></div>
</div>

<div id="sobre-mapa" class="sobreposicao" hidden>
  <div class="sobre-caixa m-janela">
    <div class="gaveta-cab"><h2>Mapa do reino</h2><button data-acao="mapa">Fechar <kbd>Esc</kbd></button></div>
    <div id="mapa-grande"></div>
    <div id="mapa-legenda"></div>
  </div>
</div>

<div id="sobre-talentos" class="sobreposicao" hidden>
  <div class="sobre-caixa m-janela talentos-caixa">
    <div class="gaveta-cab"><h2 id="talentos-titulo">Talentos</h2><button data-acao="fechar-talentos">Fechar <kbd>Esc</kbd></button></div>
    <div id="arvore"></div>
    <div id="talento-info" class="m-janela" hidden></div>
  </div>
</div>

<div id="sobre-grimorio" class="sobreposicao" hidden>
  <div class="grimorio-livro">
    <div class="grimorio-pagina esquerda" id="grimorio-indice"></div>
    <div class="grimorio-pagina direita" id="grimorio-detalhe"></div>
    <button class="grimorio-fechar" data-acao="fechar-grimorio">Fechar <kbd>Esc</kbd></button>
  </div>
</div>

<div id="celebracao" class="sobreposicao" hidden></div>
<div id="toasts"></div>

<div id="aviso-fim" class="sobreposicao" hidden>
  <div class="sobre-caixa m-janela fim"><h2>Até a próxima jornada</h2><p>Você já pode fechar esta janela.</p></div>
</div>

<script src="/static/texto.js"></script>
<script src="/static/som.js"></script>
<script src="/static/vista.js"></script>
<script src="/static/mapa.js"></script>
<script src="/static/realce.js"></script>
<script src="/static/telas.js"></script>
<script src="/static/sensacao.js"></script>
<script src="/static/batalha.js"></script>
<!-- a aplicação, em partes (nesta ordem) -->
<script src="/static/app/nucleo.js"></script>
<script src="/static/app/pagina.js"></script>
<script src="/static/app/escolhas.js"></script>
<script src="/static/app/paineis.js"></script>
<script src="/static/app/controles.js"></script>
</body>
</html>
